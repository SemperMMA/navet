location ^~ /__navet_chores__/ {
  # njs cannot read a request body that nginx spilled to a temp file; keep whole profiles in memory
  client_body_buffer_size 2m;
  include /etc/nginx/snippets/navet-security-headers.conf;
  client_max_body_size 64m;
  add_header Cache-Control "no-store" always;
  js_content navet_chore_store.handle;
}
